name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Project2Prompt.slnx

      - name: Build
        run: dotnet build Project2Prompt.slnx -c Debug --no-restore

      - name: Test
        run: dotnet test Project2Prompt.slnx -c Debug --no-build
